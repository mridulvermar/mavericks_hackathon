services:
  - type: web
    name: career2-backend
    env: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: CLIENT_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_TRANSLATE_KEY
        sync: false
      - key: GOOGLE_MAPS_KEY
        sync: false
